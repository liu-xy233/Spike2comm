name: dair_cost_sdtv3_qfpn_v2
yaml_parser: load_point_pillar_params
data_dir: /data/dair-v2x/cooperative-vehicle-infrastructure
root_dir: /data/dair-v2x/DAIR-V2X-C_Complemented_Anno/train.json
validate_dir: /data/dair-v2x/DAIR-V2X-C_Complemented_Anno/val.json
test_dir: /data/dair-v2x/DAIR-V2X-C_Complemented_Anno/val.json

cost_temporal:
  prev_frames: 1
  interval: 1

noise_setting:
  add_noise: false
  args:
    pos_mean: 0
    pos_std: 0.2
    rot_mean: 0
    rot_std: 0.2

train_params:
  batch_size: 4
  epoches: 20
  eval_freq: 1
  save_freq: 1
  max_cav: &max_cav 2
  num_workers: 0

fusion:
  core_method: IntermediateFusionDatasetDAIRCoST
  args:
    proj_first: false
    clip_pc: false

preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: &voxel_size [0.2, 0.2, 0.1]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-100.8, -40, -3, 100.8, 40, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ["x"]
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: VoxelPostprocessor
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 4.5
    w: 2
    h: 1.56
    r: [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: point_pillar_cost_v2
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num
    max_cav: *max_cav
    compression: 0
    backbone_fix: false
    align_ratio: 1.6

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      type: full_sdtv3_qfpn_v2
      T: 4
      embed_dims: [64, 128, 256, 360]
      conv_depths: [2, 2]
      transformer_depths: [6, 2]
      num_heads: 8
      mlp_ratio: 4
      qkv_bias: false
      sr_ratios: 1
      drop_rate: 0
      attn_drop_rate: 0
      drop_path_rate: 0
      fpn:
        input_features: [x2, x3, x4]
        in_channels: [64, 128, 360]
        out_channels: 128

    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384

    compression_module:
      mlp_dim: 256
      thresh: 0.05
      rescale_rate: 10
      reconstruct: false
      gaussian_smooth:
        k_size: 5
        c_sigma: 1.0

    deformable_transformer:
      hidden_dim: 256
      nheads: 8
      enc_layers: 2
      dec_layers: 2
      dim_feedforward: 1024
      dropout: 0.1
      enc_n_points: 4
      dec_n_points: 4
      max_cav: *max_cav
      prev_size: 1
      multi_scale: false
      multi_time: true
      time_recurrent: true
      dif_offset: true

loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0

optimizer:
  core_method: Adam
  lr: 0.0004
  args:
    eps: 1e-8
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 15]

