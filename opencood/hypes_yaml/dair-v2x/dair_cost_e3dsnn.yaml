name: dair_cost_e3dsnn
yaml_parser: load_e3dsnn_where2comm_params

data_dir: /data/dair-v2x/cooperative-vehicle-infrastructure
root_dir: /data/dair-v2x/DAIR-V2X-C_Complemented_Anno/train.json
validate_dir: /data/dair-v2x/DAIR-V2X-C_Complemented_Anno/val.json
test_dir: /data/dair-v2x/DAIR-V2X-C_Complemented_Anno/val.json

cost_temporal:
  prev_frames: 1
  interval: 1

fusion:
  core_method: IntermediateFusionDatasetDAIRE3DSNNCoST
  args:
    proj_first: false
    clip_pc: false

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [x]
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

preprocess:
  core_method: E3DSNNVoxelPreprocessor
  cav_lidar_range: &lidar_range [-100.8, -40, -3, 100.8, 40, 1]
  args:
    voxel_size: &voxel_size [0.2, 0.2, 0.1]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
    num_point_features: 4
    encoding: mean
    num_time_bins: 1

model:
  core_method: point_pillar_cost_e3dsnn
  args:
    anchor_number: 2
    backbone_fix: false
    input_channels: 4
    lidar_range: *lidar_range
    voxel_size: *voxel_size
    max_cav: &max_cav 2
    feature_stride: 8
    align_ratio: 1.6
    spatial_align: true
    compression: 0
    head_in_channels: 256
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      type: e3dsnn_sparse_spike
      sparse_channels: [16, 32, 64, 64]
      embed_channels: 16
      out_channels: 128
      enc_depth: [2, 2, 2, 2]
      groups: [4, 4, 8, 16]
      enc_num_ref: [16, 16, 16, 16]
      point_grid_size:
        - [8, 12, 16, 16]
        - [6, 9, 12, 12]
        - [4, 6, 8, 8]
        - [3, 4, 6, 6]
      bev_in_channels: 128
      layer_nums: [1]
      layer_strides: [1]
      num_filters: [256]
      upsample_strides: [1]
      num_upsample_filter: [256]
    shrink_header:
      input_dim: 256
      dim: [256]
      kernal_size: [3]
      stride: [1]
      padding: [1]
    compression_module:
      mlp_dim: 256
      thresh: 0.05
      rescale_rate: 10
      smooth: false
      reconstruct: false
      gaussian_smooth:
        k_size: 5
        c_sigma: 1.0
    deformable_transformer:
      hidden_dim: 256
      nheads: 8
      enc_layers: 2
      dec_layers: 2
      dim_feedforward: 1024
      dropout: 0.1
      enc_n_points: 4
      dec_n_points: 4
      max_cav: *max_cav
      prev_size: 1
      multi_scale: false
      multi_time: true
      time_recurrent: true
      dif_offset: true

loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0

optimizer:
  core_method: Adam
  lr: 0.0004
  args:
    eps: 1e-8
    weight_decay: 0.0001

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 15]

postprocess:
  core_method: VoxelPostprocessor
  gt_range: *lidar_range
  max_num: 100
  nms_thresh: 0.15
  order: hwl
  anchor_args:
    cav_lidar_range: *lidar_range
    l: 4.5
    w: 2
    h: 1.56
    r: [0, 90]
    num: 2
    feature_stride: 8
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2

noise_setting:
  add_noise: false
  args:
    pos_mean: 0
    pos_std: 0.2
    rot_mean: 0
    rot_std: 0.2

train_params:
  batch_size: 4
  epoches: 20
  eval_freq: 1
  save_freq: 1
  max_cav: 2
  num_workers: 0
