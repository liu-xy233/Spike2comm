name: dair_where2comm_attn_multiscale_e3dsnn_dfa
yaml_parser: load_e3dsnn_where2comm_params

data_dir: /workspace/dair-v2x-coalign/cooperative-vehicle-infrastructure
root_dir: /workspace/dair-v2x-coalign/cooperative-vehicle-infrastructure/train.json
validate_dir: /workspace/dair-v2x-coalign/cooperative-vehicle-infrastructure/val.json
test_dir: /workspace/dair-v2x-coalign/cooperative-vehicle-infrastructure/val.json

fusion:
  core_method: IntermediateFusionDatasetDAIRE3DSNN
  args:
    proj_first: false
    clip_pc: false

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [x]
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

preprocess:
  core_method: E3DSNNVoxelPreprocessor
  cav_lidar_range: &lidar_range [-100.8, -40, -3, 100.8, 40, 1]
  args:
    voxel_size: &voxel_size [0.2, 0.2, 0.1]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
    num_point_features: 4
    encoding: mean
    num_time_bins: 1

model:
  core_method: point_pillar_where2comm_e3dsnn
  args:
    anchor_number: 2
    backbone_fix: false
    dfa_only_train: true
    input_channels: 4
    lidar_range: *lidar_range
    voxel_size: *voxel_size
    max_cav: 2
    compression: 0
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      type: e3dsnn_sparse_spike
      sparse_channels: [16, 32, 64, 64]
      embed_channels: 16
      out_channels: 128
      enc_depth: [2, 2, 2, 2]
      groups: [4, 4, 8, 16]
      enc_num_ref: [16, 16, 16, 16]
      point_grid_size:
        - [8, 12, 16, 16]
        - [6, 9, 12, 12]
        - [4, 6, 8, 8]
        - [3, 4, 6, 6]
      bev_in_channels: 128
      layer_nums: &layer_nums [1]
      layer_strides: [1]
      num_filters: &num_filters [256]
      upsample_strides: [1]
      num_upsample_filter: [256]
    shrink_header:
      input_dim: 256
      dim: [256]
      kernal_size: [3]
      stride: [1]
      padding: [1]
    fusion_args:
      multi_scale: true
      in_channels: 256
      use_dfa: true
      dfa_num_levels: 4
      dfa_num_points: 5
      dfa_num_heads: 8
      dfa_mask_aware: true
      dfa_query_source: where2comm_mask
      dfa_fill_mode: replace
      dfa_use_multiscale: true
      dfa_init_level1_bias: 4.0
      layer_nums: *layer_nums
      num_filters: *num_filters
      downsample_rate: 8
      voxel_size: *voxel_size
      n_head: 8
      dropout_rate: 0
      only_attention: true
      agg_operator:
        mode: ATTEN
        feature_dim: 256
      communication:
        thre: 0.05
        round: 1
        gaussian_smooth:
          k_size: 5
          c_sigma: 1.0

loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0

optimizer:
  core_method: Adam
  lr: 0.0002
  args:
    eps: 1e-8
    weight_decay: 0.0001

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [1]

postprocess:
  core_method: VoxelPostprocessor
  gt_range: *lidar_range
  max_num: 100
  nms_thresh: 0.15
  order: hwl
  anchor_args:
    cav_lidar_range: *lidar_range
    l: 4.5
    w: 2
    h: 1.56
    r: [0, 90]
    num: 2
    feature_stride: 8
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2

noise_setting:
  add_noise: false
  args:
    pos_mean: 0
    pos_std: 0.2
    rot_mean: 0
    rot_std: 0.2

train_params:
  batch_size: 4
  epoches: 20
  eval_freq: 1
  save_freq: 1
  max_cav: 2
  num_workers: 0