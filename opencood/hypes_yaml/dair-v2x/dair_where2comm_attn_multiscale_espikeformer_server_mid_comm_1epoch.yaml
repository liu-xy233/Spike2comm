name: dair_where2comm_attn_multiscale_espikeformer_server_mid_comm_1epoch
data_dir: /data/dair-v2x/cooperative-vehicle-infrastructure
root_dir: /data/dair-v2x/cooperative-vehicle-infrastructure/train_256.json
validate_dir: /data/dair-v2x/cooperative-vehicle-infrastructure/val_64.json
test_dir: /data/dair-v2x/cooperative-vehicle-infrastructure/val_64.json
noise_setting:
  add_noise: false
  args:
    pos_std: 0.2
    rot_std: 0.2
    pos_mean: 0
    rot_mean: 0
yaml_parser: load_point_pillar_params
train_params:
  batch_size: 1
  epoches: 1
  eval_freq: 1
  save_freq: 1
  max_cav: 2
  num_workers: 0
fusion:
  core_method: IntermediateFusionDatasetDAIR
  args:
    proj_first: false
    clip_pc: false
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: &id002
    - 0.4
    - 0.4
    - 4
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &id001
  - -100.8
  - -40
  - -3
  - 100.8
  - 40
  - 1
data_augment:
- NAME: random_world_flip
  ALONG_AXIS_LIST:
  - x
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
postprocess:
  core_method: VoxelPostprocessor
  gt_range: *id001
  anchor_args:
    cav_lidar_range: *id001
    l: 4.5
    w: 2
    h: 1.56
    r:
    - 0
    - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 100
  nms_thresh: 0.15
model:
  core_method: point_pillar_where2comm
  args:
    voxel_size: *id002
    lidar_range: *id001
    anchor_number: 2
    max_cav: 2
    compression: 0
    backbone_fix: false
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters:
      - 64
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      type: e_spikeformer
      layer_nums: &id003
      - 1
      - 2
      - 6
      layer_strides:
      - 2
      - 2
      - 2
      num_filters: &id004
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
      stage_types:
      - conv
      - conv
      - attention
      T: 4
      num_heads: 8
      mlp_ratios: 4
      qkv_bias: false
      drop_rate: 0
      attn_drop_rate: 0
      drop_path_rate: 0
      sr_ratios: 1
      compression: 0
      voxel_size: *id002
    shrink_header:
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    fusion_args:
      voxel_size: *id002
      downsample_rate: 1
      in_channels: 256
      n_head: 8
      dropout_rate: 0
      only_attention: true
      agg_operator:
        mode: ATTEN
        feature_dim: 256
      multi_scale: true
      layer_nums: *id003
      num_filters: *id004
      communication:
        round: 1
        thre: 0.01
        gaussian_smooth:
          k_size: 5
          c_sigma: 1.0
loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0
optimizer:
  core_method: Adam
  lr: 0.0002
  args:
    eps: 1e-8
    weight_decay: 1e-4
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 1
